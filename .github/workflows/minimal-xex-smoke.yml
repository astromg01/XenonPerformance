name: Xenon Performance v1.8.6 strict PowerPCBE XEX smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/minimal-xex-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xenon-performance-v186-strict-xex
  cancel-in-progress: true

jobs:
  build:
    name: Build strict PowerPCBE inert Xbox 360 DLL XEX
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Install small host-only build set
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils cmake ninja-build git python3 ca-certificates zip

      - name: Build strict PowerPCBE PE wrapper and SynthXEX
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/build_xex_smoke"
          SRC="$OUT/synthxex-src"
          BUILD="$OUT/synthxex-build"
          REL="$OUT/release"
          LOG="$OUT/build.log"
          COMMIT="48d1453a55468aa2f8a211db0b20edd594ef5be3"
          mkdir -p "$OUT" "$REL"
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1

          echo 'XPXEXSMOKE2 stage=pe begin'
          cat > "$OUT/ppc_dll_stub.s" <<'ASM'
          .section .text
          .globl _start
          _start:
              .byte 0x38, 0x60, 0x00, 0x01
              .byte 0x4e, 0x80, 0x00, 0x20
          ASM

          as --32 "$OUT/ppc_dll_stub.s" -o "$OUT/ppc_dll_stub.o"
          ld -mi386pe --dll --subsystem 14 \
            --major-subsystem-version 1 --minor-subsystem-version 0 \
            --major-os-version 0 --minor-os-version 0 \
            --disable-dynamicbase --image-base 0x82000000 \
            --section-alignment 0x10000 --file-alignment 0x200 \
            --disable-long-section-names -e _start \
            -o "$OUT/XenonPerformanceSmokePlugin.exe" "$OUT/ppc_dll_stub.o"

          # GNU's host PE linker stamps IMAGE_FILE_MACHINE_I386. The payload is
          # deliberately raw Xenon/PowerPC code, so correct the COFF Machine field
          # to IMAGE_FILE_MACHINE_POWERPCBE (0x01F2) before SynthXEX validation.
          python3 - "$OUT/XenonPerformanceSmokePlugin.exe" <<'PY'
          import struct,sys
          p=sys.argv[1]
          d=bytearray(open(p,'rb').read())
          pe=struct.unpack_from('<I',d,0x3c)[0]
          if d[pe:pe+4] != b'PE\0\0': raise SystemExit('XPMACHINE1 FAIL missing PE')
          old=struct.unpack_from('<H',d,pe+4)[0]
          if old != 0x014c: raise SystemExit(f'XPMACHINE1 FAIL unexpected machine 0x{old:04x}')
          struct.pack_into('<H',d,pe+4,0x01F2)
          open(p,'wb').write(d)
          print('XPMACHINE1 PASS i386->POWERPCBE')
          PY

          python3 - "$OUT/XenonPerformanceSmokePlugin.exe" <<'PY'
          import struct,sys,hashlib
          p=sys.argv[1]; d=open(p,'rb').read(); errors=[]
          if d[:2] != b'MZ': errors.append('missing MZ')
          pe=struct.unpack_from('<I',d,0x3c)[0]
          if d[pe:pe+4] != b'PE\0\0': errors.append('missing PE')
          machine=struct.unpack_from('<H',d,pe+4)[0]
          sections=struct.unpack_from('<H',d,pe+6)[0]
          optsz=struct.unpack_from('<H',d,pe+20)[0]
          chars=struct.unpack_from('<H',d,pe+22)[0]
          opt=pe+24
          entry=struct.unpack_from('<I',d,opt+16)[0]
          base=struct.unpack_from('<I',d,opt+28)[0]
          align=struct.unpack_from('<I',d,opt+32)[0]
          subsystem=struct.unpack_from('<H',d,opt+68)[0]
          if machine != 0x01F2: errors.append(f'machine=0x{machine:04x}')
          if not (chars & 0x2000): errors.append('not DLL')
          if subsystem != 0x000e: errors.append('not Xbox subsystem')
          if base != 0x82000000: errors.append('image base')
          if align != 0x10000: errors.append('alignment')
          st=opt+optsz; found=False
          for i in range(sections):
              s=st+i*40
              vs,va,rs,rp,fl=struct.unpack_from('<IIIIxxxxxxxxxxxxI',d,s+8)
              if va <= entry < va+max(vs,rs):
                  pos=rp+(entry-va); code=d[pos:pos+8]; found=True
                  if code != bytes.fromhex('386000014e800020'): errors.append('entry bytes')
          if not found: errors.append('entry mapping')
          if errors: raise SystemExit('XPPESTUB2 FAIL: '+', '.join(errors))
          print('XPPESTUB2 PASS machine=POWERPCBE sha256='+hashlib.sha256(d).hexdigest())
          PY

          git init -q "$SRC"
          git -C "$SRC" remote add origin https://github.com/OpenXeChain/SynthXEX.git
          git -C "$SRC" fetch -q --depth 1 origin "$COMMIT"
          git -C "$SRC" -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
          test "$(git -C "$SRC" rev-parse HEAD)" = "$COMMIT"
          echo "XPXEXSMOKE2 stage=synthxex_source pass commit=$COMMIT"

          cmake -S "$SRC" -B "$BUILD" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$BUILD" --parallel 4
          test -x "$BUILD/synthxex"
          echo 'XPXEXSMOKE2 stage=synthxex_host pass'

          # Strict path: no --skip-machine-check.
          "$BUILD/synthxex" \
            --input "$OUT/XenonPerformanceSmokePlugin.exe" \
            --output "$REL/XenonPerformanceSmokePlugin-v1.8.6.xex" \
            --type dll

          python3 - "$REL/XenonPerformanceSmokePlugin-v1.8.6.xex" <<'PY'
          import struct,sys,hashlib
          p=sys.argv[1]; d=open(p,'rb').read(); errors=[]
          if len(d) < 256: errors.append('too small')
          if d[:4] != b'XEX2': errors.append('missing XEX2')
          if not errors:
              flags,peoff,res,secoff,count=struct.unpack('>IIIII',d[4:24])
              if not (flags & (1<<3)): errors.append('DLL flag missing')
              if 24+count*8 > len(d): errors.append('header table outside file')
              ids=[]
              if not errors:
                  for i in range(count): ids.append(struct.unpack('>II',d[24+i*8:32+i*8])[0])
                  if 0x00010100 not in ids: errors.append('entry header missing')
              if peoff and peoff >= len(d): errors.append('PE offset outside file')
              if secoff and secoff >= len(d): errors.append('security offset outside file')
          if errors: raise SystemExit('XPXEXSTUB2 FAIL: '+', '.join(errors))
          print('XPXEXSTUB2 PASS sha256='+hashlib.sha256(d).hexdigest())
          PY

          cat > "$REL/SMOKE_FIRST_RUN_v1.8.6.txt" <<'TXT'
          XENON PERFORMANCE v1.8.6 — STRICT POWERPCBE RESIDENT XEX SMOKE

          Changes from v1.8.5:
          - PE COFF Machine is POWERPCBE (0x01F2), not i386.
          - SynthXEX machine validation is enabled; --skip-machine-check is NOT used.
          - Entry remains inert: li r3,1 ; blr.
          - No game-memory, SMC, NAND/flash, filesystem or optimization writes.

          Do not install permanently at boot yet. This remains a hardware-load smoke test.
          TXT

          python3 - "$OUT/XenonPerformanceSmokePlugin.exe" "$REL/XenonPerformanceSmokePlugin-v1.8.6.xex" "$REL/XPXEXSMOKE2.json" <<'PY'
          import sys,hashlib,json,os,struct
          pe,xex,out=sys.argv[1:]
          def info(p):
              d=open(p,'rb').read(); return {'name':os.path.basename(p),'size':len(d),'sha256':hashlib.sha256(d).hexdigest()}
          d=open(pe,'rb').read(); off=struct.unpack_from('<I',d,0x3c)[0]
          r={'schema':'XPXEXSMOKE2','version':'1.8.6','purpose':'strict POWERPCBE inert resident DLL XEX load smoke test','writes':0,'machine':'0x01F2 POWERPCBE','synthxex_skip_machine_check':False,'powerpc_entry_bytes':'386000014e800020','pe':info(pe),'xex':info(xex),'synthxex_commit':'48d1453a55468aa2f8a211db0b20edd594ef5be3'}
          open(out,'w').write(json.dumps(r,indent=2,sort_keys=True)+'\n')
          print(json.dumps(r,indent=2,sort_keys=True))
          PY

          cp "$OUT/XenonPerformanceSmokePlugin.exe" "$REL/XenonPerformanceSmokePlugin-v1.8.6.exe"
          (cd "$REL" && zip -9 XenonPerformance-v1.8.6-Strict-PowerPCBE-XEX.zip XenonPerformanceSmokePlugin-v1.8.6.xex XenonPerformanceSmokePlugin-v1.8.6.exe SMOKE_FIRST_RUN_v1.8.6.txt XPXEXSMOKE2.json)
          echo 'XPXEXSMOKE2 PASS'

      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XenonPerformance-v1.8.6-strict-xex-diagnostics
          if-no-files-found: warn
          retention-days: 14
          path: |
            build_xex_smoke/build.log
            build_xex_smoke/XenonPerformanceSmokePlugin.exe

      - name: Upload strict XEX smoke bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XenonPerformance-v1.8.6-Strict-PowerPCBE-XEX
          compression-level: 9
          retention-days: 14
          path: build_xex_smoke/release/
