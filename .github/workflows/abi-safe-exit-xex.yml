name: Xenon Performance v1.8.8 ABI-safe XEX exit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/abi-safe-exit-xex.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xenon-performance-v188-abi-safe-exit
  cancel-in-progress: true

jobs:
  build:
    name: Build ABI-safe Xbox 360 title XEX
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Install small host-only build set
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils binutils-powerpc-linux-gnu \
            cmake ninja-build git python3 ca-certificates zip

      - name: Build ABI-safe PowerPC title and SynthXEX
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/build_xex_abi_safe"
          SRC="$OUT/synthxex-src"
          BUILD="$OUT/synthxex-build"
          REL="$OUT/release"
          LOG="$OUT/build.log"
          COMMIT="48d1453a55468aa2f8a211db0b20edd594ef5be3"
          mkdir -p "$OUT" "$REL"
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1

          cat > "$OUT/abi_safe_exit_ppc.s" <<'ASM'
          # Xenon Performance v1.8.8 ABI-safe title smoke test.
          # Fix over v1.8.7: create a real 32-bit PowerPC caller stack frame
          # before making any nested or kernel calls.
          # 0x193 = XexExecutableModuleHandle (exported variable)
          # 0x1A2 = XexUnloadImageAndExitThread(module_handle, exit_code)

          .set KERN_ORDINAL_XEX_EXECUTABLE_MODULE_HANDLE, 0x193
          .set KERN_ORDINAL_XEX_UNLOAD_IMAGE_AND_EXIT_THREAD, 0x1A2

          .section .text
          .global _start

          _start:
              # Standard PPC32-style caller frame. The callee may use the
              # caller linkage area at old-SP+4, so v1.8.7 was unsafe here.
              mflr    r0
              stwu    r1, -0x80(r1)
              stw     r0, 0x84(r1)
              stw     r30, 0x78(r1)

              # Resolve address of XexExecutableModuleHandle.
              li      r3, KERN_ORDINAL_XEX_EXECUTABLE_MODULE_HANDLE
              bl      getKernelExportByOrdinal
              cmpwi   r3, 0
              beq     fail_closed

              # Export 0x193 is a 32-bit guest pointer variable.
              lwz     r30, 0(r3)
              cmpwi   r30, 0
              beq     fail_closed

              # Resolve XexUnloadImageAndExitThread.
              li      r3, KERN_ORDINAL_XEX_UNLOAD_IMAGE_AND_EXIT_THREAD
              bl      getKernelExportByOrdinal
              cmpwi   r3, 0
              beq     fail_closed

              # Correct title shutdown. This call should not return.
              mtctr   r3
              mr      r3, r30
              li      r4, 0
              bctrl

              b       fail_closed

          # Read a little-endian 32-bit PE value from address in r3.
          get32BitLittleEndian:
              li      r4, 24
              lbz     r5, 3(r3)
              slw     r5, r5, r4
              subi    r4, r4, 8
              lbz     r6, 2(r3)
              slw     r6, r6, r4
              subi    r4, r4, 8
              or      r5, r5, r6
              lbz     r6, 1(r3)
              slw     r6, r6, r4
              or      r5, r5, r6
              lbz     r6, 0(r3)
              or      r5, r5, r6
              mr      r3, r5
              blr

          # r3 = ordinal. Returns kernel export VA in r3, or 0.
          getKernelExportByOrdinal:
              mflr    r12
              mr      r7, r3

              lis     r3, 0x8004
              ori     r3, r3, 0x003c
              bl      get32BitLittleEndian
              addis   r3, r3, 0x8004

              addi    r3, r3, 0x78
              bl      get32BitLittleEndian
              addis   r3, r3, 0x8004

              mr      r8, r3
              addi    r3, r3, 0x14
              bl      get32BitLittleEndian
              cmpw    r7, r3
              bgt     kernel_export_not_found

              subi    r7, r7, 1
              addi    r3, r8, 0x1c
              bl      get32BitLittleEndian
              addis   r3, r3, 0x8004

              mulli   r7, r7, 4
              add     r3, r3, r7
              bl      get32BitLittleEndian
              addis   r3, r3, 0x8004

              mtlr    r12
              blr

          kernel_export_not_found:
              li      r3, 0
              mtlr    r12
              blr

          fail_closed:
              b       fail_closed
          ASM

          echo 'XPXEXABI1 stage=ppc_assemble begin'
          powerpc-linux-gnu-as -mregnames -mppc64 "$OUT/abi_safe_exit_ppc.s" -o "$OUT/abi_safe_exit_ppc.o"
          powerpc-linux-gnu-objcopy -O binary -j .text "$OUT/abi_safe_exit_ppc.o" "$OUT/abi_safe_exit_ppc.bin"
          powerpc-linux-gnu-objdump -dr "$OUT/abi_safe_exit_ppc.o" > "$REL/abi_safe_exit_ppc.disasm.txt"
          test -s "$OUT/abi_safe_exit_ppc.bin"
          grep -q 'stwu' "$REL/abi_safe_exit_ppc.disasm.txt"
          grep -qi '193' "$OUT/abi_safe_exit_ppc.s"
          grep -qi '1A2' "$OUT/abi_safe_exit_ppc.s"
          echo 'XPXEXABI1 stage=ppc_assemble pass'

          printf '.section .text\n.globl _start\n_start:\n.incbin "%s"\n' "$OUT/abi_safe_exit_ppc.bin" > "$OUT/wrapper.s"
          as --32 "$OUT/wrapper.s" -o "$OUT/wrapper.o"
          ld -mi386pe --subsystem 14 \
            --major-subsystem-version 1 --minor-subsystem-version 0 \
            --major-os-version 0 --minor-os-version 0 \
            --disable-dynamicbase --image-base 0x82000000 \
            --section-alignment 0x10000 --file-alignment 0x200 \
            --disable-long-section-names -e _start \
            -o "$OUT/XenonPerformanceAbiSafe.exe" "$OUT/wrapper.o"

          python3 - "$OUT/XenonPerformanceAbiSafe.exe" "$OUT/abi_safe_exit_ppc.bin" <<'PY'
          import struct,sys,hashlib
          pe_path, raw_path=sys.argv[1:]
          d=open(pe_path,'rb').read(); raw=open(raw_path,'rb').read(); errors=[]
          if d[:2] != b'MZ': errors.append('missing MZ')
          pe=struct.unpack_from('<I',d,0x3c)[0]
          if d[pe:pe+4] != b'PE\0\0': errors.append('missing PE')
          sections=struct.unpack_from('<H',d,pe+6)[0]
          optsz=struct.unpack_from('<H',d,pe+20)[0]
          chars=struct.unpack_from('<H',d,pe+22)[0]
          opt=pe+24
          entry=struct.unpack_from('<I',d,opt+16)[0]
          base=struct.unpack_from('<I',d,opt+28)[0]
          align=struct.unpack_from('<I',d,opt+32)[0]
          subsystem=struct.unpack_from('<H',d,opt+68)[0]
          if chars & 0x2000: errors.append('unexpected DLL flag')
          if subsystem != 0x000e: errors.append('not Xbox subsystem')
          if base != 0x82000000: errors.append('image base')
          if align != 0x10000: errors.append('alignment')
          st=opt+optsz; found=False
          for i in range(sections):
              s=st+i*40
              vs,va,rs,rp=struct.unpack_from('<IIII',d,s+8)
              if va <= entry < va+max(vs,rs):
                  pos=rp+(entry-va); found=True
                  if d[pos:pos+len(raw)] != raw: errors.append('PPC payload mismatch')
          if not found: errors.append('entry mapping')
          if errors: raise SystemExit('XPPE188 FAIL: '+', '.join(errors))
          print('XPPE188 PASS pe_sha256='+hashlib.sha256(d).hexdigest()+' ppc_sha256='+hashlib.sha256(raw).hexdigest())
          PY

          echo 'XPXEXABI1 stage=synthxex begin'
          git init -q "$SRC"
          git -C "$SRC" remote add origin https://github.com/OpenXeChain/SynthXEX.git
          git -C "$SRC" fetch -q --depth 1 origin "$COMMIT"
          git -C "$SRC" -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
          test "$(git -C "$SRC" rev-parse HEAD)" = "$COMMIT"
          cmake -S "$SRC" -B "$BUILD" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$BUILD" --parallel 4
          test -x "$BUILD/synthxex"

          "$BUILD/synthxex" --skip-machine-check \
            --input "$OUT/XenonPerformanceAbiSafe.exe" \
            --output "$REL/XenonPerformanceAbiSafe.xex" \
            --type title

          python3 - "$REL/XenonPerformanceAbiSafe.xex" <<'PY'
          import struct,sys,hashlib
          p=sys.argv[1]; d=open(p,'rb').read(); errors=[]
          if len(d) < 256: errors.append('too small')
          if d[:4] != b'XEX2': errors.append('missing XEX2')
          if not errors:
              flags,peoff,res,secoff,count=struct.unpack('>IIIII',d[4:24])
              if not (flags & 0x1): errors.append('TITLE flag missing')
              if flags & 0x8: errors.append('DLL flag unexpectedly set')
              if 24+count*8 > len(d): errors.append('header table outside file')
              ids=[struct.unpack('>II',d[24+i*8:32+i*8])[0] for i in range(count)] if not errors else []
              if 0x00010100 not in ids: errors.append('entry header missing')
          if errors: raise SystemExit('XPXEX188 FAIL: '+', '.join(errors))
          print('XPXEX188 PASS sha256='+hashlib.sha256(d).hexdigest())
          PY

          cat > "$REL/README_FIRST_RUN.txt" <<'TXT'
          XENON PERFORMANCE v1.8.8 — ABI-SAFE EXIT TEST

          This build fixes the v1.8.7 caller-frame bug before invoking Xbox kernel code.
          It does not patch games, NAND/flash, SMC, or game memory.

          TEST:
          - Do not add to DashLaunch plugins or launch.ini.
          - Launch XenonPerformanceAbiSafe.xex once from XeXMenu/Aurora.
          - PASS: returns to launcher/dashboard without fatal crash, reboot, or freeze.
          - FAIL: any fatal crash/reboot/freeze. Do not run it again; report the exact behavior.
          TXT

          python3 - "$REL/XenonPerformanceAbiSafe.xex" "$REL/XPXEXABI1.json" <<'PY'
          import sys,hashlib,json,os
          xex,out=sys.argv[1:]
          d=open(xex,'rb').read()
          r={'schema':'XPXEXABI1','version':'1.8.8','purpose':'ABI-safe title enter/clean-exit smoke test','writes':0,'nand_flash_writes':0,'game_memory_writes':0,'smc_writes':0,'xex':{'name':os.path.basename(xex),'size':len(d),'sha256':hashlib.sha256(d).hexdigest()},'synthxex_commit':'48d1453a55468aa2f8a211db0b20edd594ef5be3'}
          open(out,'w').write(json.dumps(r,indent=2,sort_keys=True)+'\n')
          print(json.dumps(r,indent=2,sort_keys=True))
          PY

          cp "$OUT/XenonPerformanceAbiSafe.exe" "$REL/"
          (cd "$REL" && zip -9 XenonPerformance-v1.8.8-ABI-Safe-XEX.zip \
            XenonPerformanceAbiSafe.xex XenonPerformanceAbiSafe.exe \
            README_FIRST_RUN.txt XPXEXABI1.json abi_safe_exit_ppc.disasm.txt)
          echo 'XPXEXABI1 PASS'

      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XenonPerformance-v1.8.8-abi-safe-diagnostics
          if-no-files-found: warn
          retention-days: 14
          path: |
            build_xex_abi_safe/build.log
            build_xex_abi_safe/abi_safe_exit_ppc.s
            build_xex_abi_safe/abi_safe_exit_ppc.bin
            build_xex_abi_safe/release/abi_safe_exit_ppc.disasm.txt
            build_xex_abi_safe/XenonPerformanceAbiSafe.exe

      - name: Upload ABI-safe XEX bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XenonPerformance-v1.8.8-ABI-Safe-XEX
          compression-level: 9
          retention-days: 14
          path: build_xex_abi_safe/release/
