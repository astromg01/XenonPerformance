name: Xenon Performance v1.9.0 FCX-native title

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fcx-native-title.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xenon-performance-v190-fcx-native
  cancel-in-progress: true

jobs:
  build:
    name: Build with real FreeChainXenon binutils
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Install host build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex texinfo git cmake ninja-build \
            python3 zip ca-certificates zlib1g-dev

      - name: Restore mini FCX binutils cache
        id: fcx-cache
        uses: actions/cache@v4
        with:
          path: ~/fcx-mini
          key: fcx-mini-gas-ld-2.43.1-v2-${{ runner.os }}-${{ runner.arch }}

      - name: Build only the FCX assembler and PE linker
        if: steps.fcx-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/fcx-build"
          PREFIX="$HOME/fcx-mini"
          SRC="$ROOT/binutils-gdb"
          mkdir -p "$ROOT" "$PREFIX"

          git clone --depth 1 --branch binutils-2.43.1 \
            https://github.com/FreeChainXenon/binutils-gdb.git "$SRC"

          mkdir "$ROOT/build-main"
          cd "$ROOT/build-main"
          "$SRC/configure" \
            --target=powerpc64-fcx-xenon \
            --prefix="$PREFIX" \
            --disable-nls --disable-werror --disable-gdb
          make -j"$(nproc)" all-gas
          make install-gas

          mkdir "$ROOT/build-pe"
          cd "$ROOT/build-pe"
          "$SRC/configure" \
            --target=powerpc64-fcx-xenonpe \
            --prefix="$PREFIX" \
            --disable-nls --disable-werror --disable-gdb
          make -j"$(nproc)" all-ld
          make install-ld

      - name: Build native Xbox PE and XEX
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/fcx-mini/bin:$PATH"
          OUT="$GITHUB_WORKSPACE/build_fcx_native"
          REL="$OUT/release"
          SYNTH_SRC="$OUT/synthxex-src"
          SYNTH_BUILD="$OUT/synthxex-build"
          SYNTH_COMMIT="aee2b8c69a7843af32bb121cdde7722869094fcf"
          mkdir -p "$OUT" "$REL"

          command -v powerpc64-fcx-xenon-as | tee "$REL/toolchain.log"
          command -v powerpc64-fcx-xenonpe-ld | tee -a "$REL/toolchain.log"
          powerpc64-fcx-xenon-as --version | head -n 1 | tee -a "$REL/toolchain.log"
          powerpc64-fcx-xenonpe-ld --version | head -n 1 | tee -a "$REL/toolchain.log"

          cat > "$OUT/fcx_native_exit.s" <<'ASM'
          # Xenon Performance v1.9.0 FCX-native title smoke test.
          # The build flow intentionally mirrors FreeChainXenon/FCX-Test:
          # powerpc64-fcx-xenon-as -a32 -mppc64 -> powerpc64-fcx-xenonpe-ld.
          # No persistent writes and no title/game-memory patches.

          .set ORD_XEX_GET_MODULE_HANDLE, 0x195
          .set ORD_XEX_UNLOAD_IMAGE_AND_EXIT_THREAD, 0x1A2

          .global _start
          .text

          # IN r4: little-endian 32-bit field address
          # OUT r4: host-order value
          get32BitLittleEndian:
              li      r5, 24
              lbz     r6, 3(r4)
              slw     r6, r6, r5
              subi    r5, r5, 8
              lbz     r7, 2(r4)
              slw     r7, r7, r5
              subi    r5, r5, 8
              or      r6, r6, r7
              lbz     r7, 1(r4)
              slw     r7, r7, r5
              or      r6, r6, r7
              lbz     r7, 0(r4)
              or      r4, r6, r7
              blr

          kernelFunctionNotFound:
              li      r3, 0
              mtlr    r12
              blr

          # IN r3: xboxkrnl ordinal
          # OUT r3: resolved export address, or 0
          getKernelFunctionAddrByOrdinal:
              mflr    r12

              lis     r4, 0x8004
              ori     r4, r4, 0x3C
              bl      get32BitLittleEndian
              addis   r4, r4, 0x8004

              addi    r4, r4, 0x78
              bl      get32BitLittleEndian
              addis   r4, r4, 0x8004

              mr      r8, r4
              addi    r4, r4, 0x14
              bl      get32BitLittleEndian
              cmpw    r3, r4
              bgt     kernelFunctionNotFound

              subi    r3, r3, 1
              addi    r4, r8, 0x1C
              bl      get32BitLittleEndian
              addis   r4, r4, 0x8004
              mulli   r3, r3, 4
              add     r4, r4, r3
              bl      get32BitLittleEndian
              addis   r3, r4, 0x8004

              mtlr    r12
              blr

          _start:
              # FCX's public test code is assembled in the Xbox 360 32-bit ABI.
              # Keep the module-handle output in this stack frame so the ELF object
              # contains no data-address relocation that the PE linker must translate.
              stwu    r1, -0x80(r1)
              li      r0, 0
              stw     r0, 0x20(r1)

              li      r3, ORD_XEX_GET_MODULE_HANDLE
              bl      getKernelFunctionAddrByOrdinal
              cmpwi   r3, 0
              beq     fail_closed
              mtctr   r3
              li      r3, 0
              addi    r4, r1, 0x20
              bctrl
              cmpwi   r3, 0
              bne     fail_closed

              lwz     r30, 0x20(r1)
              cmpwi   r30, 0
              beq     fail_closed

              li      r3, ORD_XEX_UNLOAD_IMAGE_AND_EXIT_THREAD
              bl      getKernelFunctionAddrByOrdinal
              cmpwi   r3, 0
              beq     fail_closed
              mtctr   r3
              mr      r3, r30
              li      r4, 0
              bctrl

          fail_closed:
              b       fail_closed
          ASM

          if ! powerpc64-fcx-xenon-as \
            -o "$OUT/fcx_native_exit.o" \
            -mregnames -a32 -mppc64 "$OUT/fcx_native_exit.s" \
            > >(tee "$REL/assembler.log") 2>&1; then
            echo "ASSEMBLER_FAILED" | tee -a "$REL/assembler.log"
            exit 31
          fi

          if ! powerpc64-fcx-xenonpe-ld \
            --accept-unknown-input-arch \
            --subsystem xbox \
            --major-subsystem-version 1 --minor-subsystem-version 0 \
            --major-os-version 0 --minor-os-version 0 \
            --disable-dynamicbase \
            --image-base 0x82000000 \
            --section-alignment=0x10000 \
            --disable-long-section-names \
            -e _start \
            -o "$OUT/XenonPerformanceFCXNative.exe" "$OUT/fcx_native_exit.o" \
            > >(tee "$REL/linker.log") 2>&1; then
            echo "LINKER_FAILED" | tee -a "$REL/linker.log"
            exit 32
          fi

          python3 - "$OUT/XenonPerformanceFCXNative.exe" <<'PY'
          import struct,sys,hashlib
          p=sys.argv[1]; d=open(p,'rb').read(); errors=[]
          if d[:2] != b'MZ': errors.append('MZ')
          if len(d) < 0x100: errors.append('size')
          if errors: raise SystemExit('XPFCXPE1 FAIL '+','.join(errors))
          pe=struct.unpack_from('<I',d,0x3c)[0]
          if d[pe:pe+4] != b'PE\0\0': errors.append('PE')
          machine=struct.unpack_from('<H',d,pe+4)[0]
          opt=pe+24
          magic=struct.unpack_from('<H',d,opt)[0]
          entry=struct.unpack_from('<I',d,opt+16)[0]
          if magic == 0x10b:
              image=struct.unpack_from('<I',d,opt+28)[0]
              align=struct.unpack_from('<I',d,opt+32)[0]
              subsystem=struct.unpack_from('<H',d,opt+68)[0]
          elif magic == 0x20b:
              image=struct.unpack_from('<Q',d,opt+24)[0]
              align=struct.unpack_from('<I',d,opt+32)[0]
              subsystem=struct.unpack_from('<H',d,opt+68)[0]
          else:
              errors.append('optional_magic'); image=align=subsystem=0
          if image != 0x82000000: errors.append('image')
          if align != 0x10000: errors.append('align')
          if subsystem != 0x000e: errors.append('subsystem')
          if not entry: errors.append('entry')
          if errors: raise SystemExit('XPFCXPE1 FAIL '+','.join(errors))
          print('XPFCXPE1 PASS machine=0x%04x magic=0x%03x entry=0x%08x sha256=%s' %
                (machine,magic,entry,hashlib.sha256(d).hexdigest()))
          PY

          git init -q "$SYNTH_SRC"
          git -C "$SYNTH_SRC" remote add origin https://github.com/FreeChainXenon/SynthXEX.git
          git -C "$SYNTH_SRC" fetch -q --depth 1 origin "$SYNTH_COMMIT"
          git -C "$SYNTH_SRC" -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
          test "$(git -C "$SYNTH_SRC" rev-parse HEAD)" = "$SYNTH_COMMIT"
          cmake -S "$SYNTH_SRC" -B "$SYNTH_BUILD" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$SYNTH_BUILD" --parallel 4

          "$SYNTH_BUILD/synthxex" \
            --skip-machine-check \
            --input "$OUT/XenonPerformanceFCXNative.exe" \
            --output "$REL/XenonPerformanceFCXNative.xex" \
            --type title 2>&1 | tee "$REL/synthxex.log"

          python3 - "$REL/XenonPerformanceFCXNative.xex" <<'PY'
          import struct,sys,hashlib
          p=sys.argv[1]; d=open(p,'rb').read(); errors=[]
          if len(d)<256: errors.append('size')
          if d[:4] != b'XEX2': errors.append('XEX2')
          if not errors:
              flags,peoff,res,secoff,count=struct.unpack('>IIIII',d[4:24])
              if not (flags & 1): errors.append('TITLE')
              if flags & 8: errors.append('DLL')
              if 24+count*8>len(d): errors.append('headers')
              ids=[struct.unpack('>II',d[24+i*8:32+i*8])[0] for i in range(count)] if not errors else []
              if 0x00010100 not in ids: errors.append('entry_header')
          if errors: raise SystemExit('XPFCXXEX1 FAIL '+','.join(errors))
          print('XPFCXXEX1 PASS flags=0x%08x size=%d sha256=%s'%(flags,len(d),hashlib.sha256(d).hexdigest()))
          PY

          cat > "$REL/README_FIRST_RUN.txt" <<'TXT'
          XENON PERFORMANCE v1.9.0 — FREECHAINXENON NATIVE TITLE TEST

          This is a minimal launch/exit smoke test built with the public
          FreeChainXenon assembler + Xbox PE linker and SynthXEX.

          Runtime behavior:
          - resolve XexGetModuleHandle (0x195);
          - obtain the current executable handle into stack-local storage;
          - resolve XexUnloadImageAndExitThread (0x1A2);
          - exit the title cleanly;
          - no NAND/flash, SMC, game-memory, filesystem or optimization writes.

          Test once from Aurora/XeXMenu. Do NOT install as a DashLaunch plugin.
          PASS: returns to Aurora without Fatal Crash, reboot or freeze.
          FAIL: stop and report the exact behavior.
          TXT

          python3 - "$OUT/XenonPerformanceFCXNative.exe" "$REL/XenonPerformanceFCXNative.xex" "$REL/XPFCX1.json" <<'PY'
          import sys,hashlib,json,os,struct
          pe,xex,out=sys.argv[1:]
          pd=open(pe,'rb').read(); xd=open(xex,'rb').read(); po=struct.unpack_from('<I',pd,0x3c)[0]
          r={
            'schema':'XPFCX1','version':'1.9.0','writes':0,
            'toolchain':'FreeChainXenon binutils-2.43.1 minimal gas+ld',
            'synthxex_commit':'aee2b8c69a7843af32bb121cdde7722869094fcf',
            'pe_machine':'0x%04X'%struct.unpack_from('<H',pd,po+4)[0],
            'pe':{'size':len(pd),'sha256':hashlib.sha256(pd).hexdigest()},
            'xex':{'name':os.path.basename(xex),'size':len(xd),'sha256':hashlib.sha256(xd).hexdigest()}
          }
          open(out,'w').write(json.dumps(r,indent=2,sort_keys=True)+'\n')
          print(json.dumps(r,indent=2,sort_keys=True))
          PY

          cp "$OUT/XenonPerformanceFCXNative.exe" "$REL/"
          (cd "$REL" && sha256sum XenonPerformanceFCXNative.xex XenonPerformanceFCXNative.exe > SHA256SUMS.txt)
          (cd "$REL" && zip -9 XenonPerformance-v1.9.0-FCX-Native.zip \
            XenonPerformanceFCXNative.xex XenonPerformanceFCXNative.exe \
            README_FIRST_RUN.txt XPFCX1.json SHA256SUMS.txt)

      - name: Upload FCX native bundle and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XenonPerformance-v1.9.0-FCX-Native
          retention-days: 14
          compression-level: 9
          if-no-files-found: error
          path: build_fcx_native/release/
